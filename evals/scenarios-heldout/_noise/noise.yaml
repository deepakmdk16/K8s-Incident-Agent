    metadata:
      labels:
        app: pool-balancer
    spec:
      containers:
        - name: balancer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - echo 'pool-balancer up'; exec sleep 2147483647
          resources:
            requests:
              cpu: "512"
              memory: 64Mi
---
apiVersion: v1
kind: Namespace
metadata:
  name: fuel-tax
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ifta-filer
  namespace: fuel-tax
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: filer
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  if [ ! -f /filings/jurisdictions.csv ]; then
                    echo "ifta-filer: /filings/jurisdictions.csv is missing"
                    exit 1
                  fi
                  echo "ifta-filer: filing $(wc -l < /filings/jurisdictions.csv) jurisdictions"
              volumeMounts:
                - name: filings
                  mountPath: /filings
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
          volumes:
            - name: filings
              emptyDir: {}
