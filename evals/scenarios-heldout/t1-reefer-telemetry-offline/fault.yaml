# t1-reefer-telemetry-offline — T1, textbook single fault, held-out vocabulary.
#
# Atom: pod-unschedulable (frozen roster). The reefer-monitor pod template
#   requests cpu: "512" — 512 whole cores, where 512m was intended — which no
#   node satisfies, so the scheduler reports FailedScheduling "Insufficient
#   cpu" and both pods stay Pending forever. Host-independent by construction
#   (authoring contract rule 3: unschedulable requests use values no real host
#   satisfies).
#
# Mechanism: the monitor never starts, so no reefer temperature readings
#   arrive; the page is the telemetry-freshness alert, not a pod alert.
#
# Wait condition (wait.sh): both reefer-monitor pods Pending with
#   PodScheduled=False reason Unschedulable AND a FailedScheduling event whose
#   message contains 'Insufficient cpu'.
#
# Gold failing resource: deployment/cold-chain/reefer-monitor. Remediation: set
#   spec.template.spec.containers[0].resources.requests.cpu to 512m (any request
#   the node can satisfy); the pods then schedule and the command below runs as
#   written (counterfactual entrypoint, rule 1).
apiVersion: v1
kind: Namespace
metadata:
  name: cold-chain
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reefer-monitor-settings
  namespace: cold-chain
data:
  poll_interval_seconds: "30"
  alert_threshold_celsius: "-15"
  reading_retention_days: "90"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reefer-monitor
  namespace: cold-chain
  labels:
    app: reefer-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reefer-monitor
  template:
    metadata:
      labels:
        app: reefer-monitor
    spec:
      containers:
        - name: monitor
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "reefer-monitor: polling reefer units every ${POLL_INTERVAL_SECONDS}s"
              exec sleep 2147483647
          env:
            - name: POLL_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: reefer-monitor-settings
                  key: poll_interval_seconds
          resources:
            requests:
              cpu: "512"
              memory: 64Mi
