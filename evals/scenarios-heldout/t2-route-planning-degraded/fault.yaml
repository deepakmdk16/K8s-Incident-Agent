# t2-route-planning-degraded — T2, the cause is a custom resource of a kind
# no tool serves.
#
# Atom: app-crashloop (frozen class) with the failing object OUTSIDE today's
#   object universe: a RouteProfile — a CRD-defined kind (setup.yaml) through
#   which the dispatch team configures its optimizer. RouteProfile
#   weekday-routing's spec.solverEndpoint is route-solvr.dispatch.svc:7000, a
#   typo: no such host exists, the solver Service is route-solver.
#
# Mechanism: route-optimizer reads its profile at startup through the API
#   (ServiceAccount + Role + RoleBinding below grant exactly that), extracts
#   spec.solverEndpoint, and checks it can reach the solver before serving.
#   The check fails, the container exits 1, kubelet restarts it:
#   CrashLoopBackOff on both replicas, 0/2 Ready, the planning screen falls
#   back. eta-publisher (setup.yaml) reaches route-solver on the same port
#   throughout — the Service and the solver are healthy; the profile is wrong.
#
# Wait condition (wait.sh): both optimizer pods with restartCount >= 3 and a
#   CrashLoopBackOff wait, the optimizer log naming the typo'd endpoint as
#   unreachable, and the eta-publisher log naming the real one as reachable.
#
# Gold failing resource: routeprofile/dispatch/weekday-routing. Remediation:
#   set its spec.solverEndpoint to route-solver.dispatch.svc:7000; on the next
#   restart the check passes and the optimizer serves (counterfactual
#   entrypoint, rule 1). Nothing in the Deployment, the Service or the solver
#   changes.
#
# Rule 2: the optimizer's logic ships as a ConfigMap-mounted entrypoint; the
#   Deployment shows the wiring (profile name, API access), the script shows
#   where the endpoint comes from, the log shows the value — and no read tool
#   can open the object that holds it.
apiVersion: fleet.northbound.io/v1
kind: RouteProfile
metadata:
  name: weekday-routing
  namespace: dispatch
spec:
  region: pacific-northwest
  solverEndpoint: route-solvr.dispatch.svc:7000
  maxStops: 40
  departureWindow: "04:30-06:00"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: route-optimizer
  namespace: dispatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: routeprofile-reader
  namespace: dispatch
rules:
  - apiGroups: ["fleet.northbound.io"]
    resources: ["routeprofiles"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: route-optimizer-routeprofiles
  namespace: dispatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: routeprofile-reader
subjects:
  - kind: ServiceAccount
    name: route-optimizer
    namespace: dispatch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: route-optimizer-entrypoint
  namespace: dispatch
data:
  run.sh: |
    #!/bin/sh
    set -u
    TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    API="https://kubernetes.default.svc"
    URL="$API/apis/fleet.northbound.io/v1/namespaces/${POD_NAMESPACE}/routeprofiles/${ROUTE_PROFILE}"
    echo "route-optimizer: loading RouteProfile ${POD_NAMESPACE}/${ROUTE_PROFILE}"
    if ! BODY="$(wget -T 5 -q -O - --no-check-certificate \
        --header "Authorization: Bearer $TOKEN" "$URL" 2>&1)"; then
      echo "route-optimizer: cannot read RouteProfile ${ROUTE_PROFILE}: ${BODY}"
      exit 1
    fi
    ENDPOINT="$(printf '%s' "$BODY" | tr -d '\n' \
      | sed -n 's/.*"solverEndpoint": *"\([^"]*\)".*/\1/p')"
    if [ -z "$ENDPOINT" ]; then
      echo "route-optimizer: RouteProfile ${ROUTE_PROFILE} has no spec.solverEndpoint"
      exit 1
    fi
    HOST="${ENDPOINT%:*}"; PORT="${ENDPOINT##*:}"
    echo "route-optimizer: profile ${ROUTE_PROFILE}: solverEndpoint=${ENDPOINT}"
    if ! nc -z -w 3 "$HOST" "$PORT" 2>/dev/null; then
      echo "route-optimizer: solver ${ENDPOINT} unreachable (RouteProfile ${ROUTE_PROFILE} spec.solverEndpoint); cannot plan routes, exiting"
      exit 1
    fi
    echo "route-optimizer: connected to solver ${ENDPOINT}; serving route plans on :8080"
    mkdir -p /www && echo ok > /www/health
    exec httpd -f -p 8080 -h /www
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-optimizer
  namespace: dispatch
  labels:
    app: route-optimizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: route-optimizer
  template:
    metadata:
      labels:
        app: route-optimizer
    spec:
      serviceAccountName: route-optimizer
      containers:
        - name: optimizer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "/app/run.sh"]
          env:
            - name: ROUTE_PROFILE
              value: weekday-routing
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: entrypoint
              mountPath: /app
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: entrypoint
          configMap:
            name: route-optimizer-entrypoint
---
apiVersion: v1
kind: Service
metadata:
  name: route-optimizer
  namespace: dispatch
spec:
  selector:
    app: route-optimizer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
