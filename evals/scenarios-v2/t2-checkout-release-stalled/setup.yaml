# t2-checkout-release-stalled — setup.yaml: the PRE-FAULT healthy state.
#
# inject.sh applies this first and waits until deployment checkout/checkout-api
# is Available: three replicas of the current release, serving. fault.yaml then
# ships the next release into this healthy state (two-phase scenario).
#
# Rollout shape (kept identical in fault.yaml): maxSurge 0 / maxUnavailable 1,
# so a rollout first retires one old pod and only then creates one new one —
# the constrained-capacity strategy small clusters run. progressDeadlineSeconds
# 120 makes a rollout that cannot create its first pod report
# Progressing=False / ProgressDeadlineExceeded inside the wait budget.
apiVersion: v1
kind: Namespace
metadata:
  name: checkout
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-content
  namespace: checkout
data:
  health: |
    ok
  index.html: |
    checkout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: checkout
  labels:
    app: checkout-api
spec:
  replicas: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          env:
            - name: APP_VERSION
              value: "2026.08.28"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /www
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: content
          configMap:
            name: checkout-content
