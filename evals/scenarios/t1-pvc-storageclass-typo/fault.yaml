# Scenario t1-pvc-storageclass-typo — fault-as-code.
# Atom: unbound PVC / bad storageClass (deterministic fault roster, req 3).
# Mechanism: the StatefulSet's volumeClaimTemplate names storageClassName
# fast-ssd, which does not exist on the cluster (only 'standard'); the PVC
# stays Pending unbound and the pod waits forever on its volume. The
# container command is a plain heartbeat writer that runs as-is once the
# volume binds (counterfactual rule 1) — the fault lives entirely in the
# volumeClaimTemplate.
# Wait condition: PVC for the StatefulSet is Pending with an event naming
# storageclass "fast-ssd" not found, AND the pod is Pending. See wait.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-db
  namespace: analytics
spec:
  clusterIP: None
  selector:
    app: metrics-db
  ports:
    - name: sql
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: metrics-db
  namespace: analytics
spec:
  serviceName: metrics-db
  replicas: 1
  selector:
    matchLabels:
      app: metrics-db
  template:
    metadata:
      labels:
        app: metrics-db
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'echo "metrics-db: starting"; while true; do date >> /data/heartbeat; sleep 30; done'
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 1Gi
