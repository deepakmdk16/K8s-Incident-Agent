# Scenario t3-quiet-selector-loud-crashloop — fault-as-code. THE required
# hard case (decision doc: T3 adversarial, red-herring composition).
# Atom (gold): service selector mismatch — Service search/search selects
# app=search-api while the search pods carry app=search: Endpoints empty,
# gateway calls refused, zero events anywhere near the Service (QUIET).
# Decoy: analytics-batch/report-generator crashloops LOUDLY (events,
# restarts) on a missing EXPORT_BUCKET env — a genuine, conditional fault
# (rule 1 applies to decoys) in a namespace verifiably unrelated to search.
# T3 id: inject.sh applies the ~20-namespace noise pack before this file.
# Wait condition: Endpoints search empty AND search pods Ready x2 AND a
# gateway failure log AND report-generator restarts>=3 CrashLoopBackOff.
apiVersion: v1
kind: Namespace
metadata:
  name: search
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: search-scripts
  namespace: search
data:
  run.sh: |
    #!/bin/sh
    set -u
    mkdir -p /www
    echo "search ok" > /www/index.html
    echo "search: serving on :8080"
    exec httpd -f -p 8080 -h /www
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: search
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "/app/run.sh"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: scripts
              mountPath: /app
      volumes:
        - name: scripts
          configMap:
            name: search-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: search
spec:
  selector:
    app: search-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-gateway-scripts
  namespace: search
data:
  run.sh: |
    #!/bin/sh
    set -u
    echo "gateway: starting search poller"
    while true; do
      if wget -T 3 -q -O /dev/null http://search.search.svc.cluster.local:8080/ 2>/dev/null; then
        echo "gateway: search fetch ok"
      else
        echo "gateway: search fetch FAILED (timeout or connection refused)"
      fi
      sleep 5
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
    spec:
      containers:
        - name: gateway
          image: busybox:1.36
          command: ["sh", "/app/run.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /app
      volumes:
        - name: scripts
          configMap:
            name: web-gateway-scripts
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics-batch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-generator-scripts
  namespace: analytics-batch
data:
  run.sh: |
    #!/bin/sh
    set -u
    [ -n "${EXPORT_BUCKET:-}" ] || {
      echo "FATAL: EXPORT_BUCKET not configured; nightly report export cannot start"
      exit 1
    }
    echo "report-generator: exporting nightly reports to ${EXPORT_BUCKET}"
    while true; do echo "report-generator: idle until next export window"; sleep 60; done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-generator
  namespace: analytics-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-generator
  template:
    metadata:
      labels:
        app: report-generator
    spec:
      containers:
        - name: generator
          image: busybox:1.36
          command: ["sh", "/app/run.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /app
      volumes:
        - name: scripts
          configMap:
            name: report-generator-scripts
