# Scenario t1-crashloop-missing-env — fault-as-code.
# Atom: CrashLoopBackOff (deterministic fault roster, decision doc req 3).
# Mechanism: the worker requires AMQP_URL at startup; it is not set on the
# deployment, so the entrypoint logs FATAL and exits 1, and kubelet backs
# off. RETROFIT 2026-08-29: the original bootstrap capture used an
# UNCONDITIONAL exit (the CHANGELOG [2] anti-pattern — setting AMQP_URL
# fixed nothing, so gold's remediation was not demonstrably true). The
# command is now conditional: with AMQP_URL set the same worker runs its
# consume loop, making the remediation rehearsable (contract rules 1+6).
# Re-captured via inject.sh --force, disclosed in CHANGELOG.
# Wait condition: pod for app=checkout-worker in payments reaches
# restartCount >= 3 with waiting reason CrashLoopBackOff and the FATAL log
# line present. See wait.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-worker
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-worker
  template:
    metadata:
      labels:
        app: checkout-worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              [ -n "${AMQP_URL:-}" ] || { echo "FATAL: AMQP_URL not set"; exit 1; };
              echo "connected to queue at ${AMQP_URL}";
              while :; do echo "consuming checkout jobs"; sleep 10; done
