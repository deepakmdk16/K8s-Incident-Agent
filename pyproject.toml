[project]
name = "k8s-incident-diagnosis"
version = "0.1.0"
description = "Kubernetes incident-diagnosis agent — verified root-cause reports over kubectl-shaped tools"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "pyright[nodejs]>=1.1.400",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
